name: "Production CI/CD: Scan, Sign, and Deploy"

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'k8s/**'
  workflow_dispatch: # Allows manual trigger

# REQUIRED: Permissions for GitHub OIDC to securely authenticate to GCP and Cosign
permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: "innate-bonfire-176513"
  REGION: "us-central1"
  GAR_REPO: "oneshield-repo"
  IMAGE_NAME: "oneshield-app"
  CLUSTER_NAME: "oneshield-gke-cluster"
  WIF_PROVIDER: "projects/77272356443/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
  WIF_SA: "oneshield-sa@innate-bonfire-176513.iam.gserviceaccount.com"
  USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

jobs:
  build-scan-sign-deploy:
    name: Build, Scan, Sign, and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud (Keyless OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WIF_PROVIDER }}'
          service_account: '${{ env.WIF_SA }}'

      - name: 🐳 Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: 🔑 Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: 🔨 Build Docker Image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ./src

      # ------------------------------------------------------------------------
      # SECURITY GUARDRAIL 1: TRIVY STATIC SCANNING
      # ------------------------------------------------------------------------
      - name: 🛡️ Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          # CRITICAL: This will break the pipeline if HIGH or CRITICAL CVEs are found!
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      # ------------------------------------------------------------------------
      # SECURITY GUARDRAIL 2: COSIGN CRYPTOGRAPHIC SIGNATURE
      # ------------------------------------------------------------------------
      - name: 🖋️ Install Cosign
        if: success() # Only install and sign if Trivy passes
        uses: sigstore/cosign-installer@v3.5.0

      - name: 📤 Push Image to Artifact Registry
        if: success()
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: ✍️ Sign the Docker Image
        if: success()
        # Uses Keyless signing tied to the GitHub OIDC token. Kyverno will verify this on the cluster.
        run: |
          cosign sign --yes ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ------------------------------------------------------------------------
      # DEPLOYMENT (Skipped gracefully if cluster is decommissioned or in standby)
      # ------------------------------------------------------------------------
      - name: 🔍 Check if GKE Cluster is Active
        id: check_cluster
        if: success()
        run: |
          if gcloud container clusters describe ${{ env.CLUSTER_NAME }} --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} >/dev/null 2>&1; then
            echo "active=true" >> $GITHUB_OUTPUT
            echo "✅ GKE Cluster '${{ env.CLUSTER_NAME }}' is ACTIVE."
          else
            echo "active=false" >> $GITHUB_OUTPUT
            echo "⏸️ GKE Cluster '${{ env.CLUSTER_NAME }}' is currently DECOMMISSIONED/TORN DOWN. Skipping deployment."
          fi

      - name: 🔌 Connect kubectl to GKE Cluster
        if: success() && steps.check_cluster.outputs.active == 'true'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: 🚀 Deploy to GKE
        if: success() && steps.check_cluster.outputs.active == 'true'
        run: |
          # 1. Ensure the ai-stack namespace exists
          kubectl create namespace ai-stack --dry-run=client -o yaml | kubectl apply -f -

          # 2. Ensure sglang-ksa ServiceAccount exists
          if [ -f k8s/ai-stack/sglang-deployment.yaml ]; then
            kubectl apply -f k8s/ai-stack/sglang-deployment.yaml
          fi

          # 3. Update the deployment manifest with the new SHA tag and apply
          sed -i "s/LATEST_SHA/${{ github.sha }}/g" k8s/app/backend-deployment.yaml
          kubectl apply -f k8s/app/backend-deployment.yaml

          # 4. Ensure Ingress gateway is reconciled and bound to reserved static IP
          if [ -f k8s/ai-stack/ingress.yaml ]; then
            kubectl apply -f k8s/ai-stack/ingress.yaml
          fi


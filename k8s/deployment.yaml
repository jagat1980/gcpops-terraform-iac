# k8s/deployment.yaml
# CIS Kubernetes Benchmark & NSA/CISA Compliant Pod Security Standards
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneshield-api-gateway
  labels:
    app: oneshield-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oneshield-api-gateway
  template:
    metadata:
      labels:
        app: oneshield-api-gateway
    spec:
      # 🔒 Pod Security Context (CIS Benchmark Rule 5.2.1)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: oneshield-api
        image: us-central1-docker.pkg.dev/project-644b97eb-9375-4ec7-82e/oneshield-repo/oneshield-api:latest
        imagePullPolicy: Always

        # 🔒 Container Security Context (CIS Benchmark Rules 5.2.2 - 5.2.5)
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        ports:
        - containerPort: 8000

        env:
        - name: ONESHIELD_API_KEY
          valueFrom:
            secretKeyRef:
              name: oneshield-secrets
              key: ONESHIELD_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: oneshield-secrets
              key: OPENAI_API_KEY
              optional: true
        # 📋 Jira Cloud Governance Integration Credentials
        - name: JIRA_URL
          valueFrom:
            secretKeyRef:
              name: oneshield-secrets
              key: JIRA_URL
              optional: true
        - name: JIRA_EMAIL
          valueFrom:
            secretKeyRef:
              name: oneshield-secrets
              key: JIRA_EMAIL
              optional: true
        - name: JIRA_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: oneshield-secrets
              key: JIRA_API_TOKEN
              optional: true
        - name: JIRA_PROJECT_KEY
          valueFrom:
            secretKeyRef:
              name: oneshield-secrets
              key: JIRA_PROJECT_KEY
              optional: true
        # 🤖 Model Tier Configurations (GCP Enterprise AI Tiering)
        - name: LLM_MODEL_HIGH_REASONING
          value: "gpt-5.6-sol"
        - name: LLM_MODEL_WORKHORSE
          value: "gpt-5.6-terra"
        - name: LLM_MODEL_BUDGET
          value: "gpt-5.6-luna"

        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"

        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
        - name: cache-dir
          mountPath: /app/.cache

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: tmp-dir
        emptyDir: {}
      - name: cache-dir
        emptyDir: {}
